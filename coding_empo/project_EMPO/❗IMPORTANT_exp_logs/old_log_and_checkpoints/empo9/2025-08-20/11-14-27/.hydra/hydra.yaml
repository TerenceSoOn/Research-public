hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - reward_model.reward_manager=ttrl
    - ++reward_model.reward_kwargs.n_samples_per_prompt=7
    - ++reward_model.reward_kwargs.n_votes_per_prompt=7
    - ++reward_model.reward_kwargs.mode=train
    - ++reward_model.reward_kwargs.reward_type=semantic_entropy
    - ++reward_model.reward_kwargs.entropy_thres=1.0
    - data.train_files=[/data/coding/EMPO-main/verl/data/NM_20K.parquet]
    - data.val_files=[/data/coding/EMPO-main/verl/data/amc.parquet]
    - data.max_prompt_length=512
    - data.max_response_length=2048
    - data.train_batch_size=16
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - actor_rollout_ref.model.path=/data/coding/EMPO-main/verl/pretrained/Qwen2.5-Math-1.5B
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.actor.ppo_mini_batch_size=1
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.optim.lr=3e-7
    - actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0.0
    - actor_rollout_ref.actor.optim.warmup_style=constant
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=2560
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.kl_loss_coef=0.001
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.actor.entropy_coeff=0.0
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.name=vllm
    - ++actor_rollout_ref.rollout.top_p=0.95
    - actor_rollout_ref.rollout.temperature=1.0
    - actor_rollout_ref.rollout.enforce_eager=False
    - actor_rollout_ref.rollout.free_cache_engine=False
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.5
    - ++actor_rollout_ref.rollout.do_vote=True
    - ++actor_rollout_ref.rollout.n_vote=7
    - actor_rollout_ref.rollout.n=7
    - ++actor_rollout_ref.rollout.val_kwargs.do_sample=True
    - ++actor_rollout_ref.rollout.val_kwargs.n=16
    - ++actor_rollout_ref.rollout.val_kwargs.top_p=0.95
    - ++actor_rollout_ref.rollout.val_kwargs.temperature=0.3
    - actor_rollout_ref.rollout.max_model_len=2560
    - actor_rollout_ref.rollout.max_num_batched_tokens=2560
    - algorithm.adv_estimator=grpo
    - algorithm.use_kl_in_reward=False
    - algorithm.norm_adv_by_std_in_grpo=True
    - algorithm.gamma=1.0
    - algorithm.lam=1.0
    - algorithm.kl_ctrl.kl_coef=0.0
    - trainer.critic_warmup=999999
    - trainer.logger=[console,tensorboard]
    - trainer.n_gpus_per_node=1
    - trainer.nnodes=1
    - trainer.save_freq=50
    - trainer.test_freq=10
    - trainer.max_actor_ckpt_to_keep=2
    - trainer.max_critic_ckpt_to_keep=2
    - trainer.default_local_dir=/data/coding/EMPO-main/outputs/checkpoints/TTRL-verl-local-true-grpo/NM_20K-Qwen2.5-Math-1.5B/0820/semantic_entropy-Len@2k-bz-16-thres-1.0-grpo-111423
    - trainer.total_training_steps=200
    - trainer.total_epochs=2
  job:
    name: main_ppo
    chdir: null
    override_dirname: ++actor_rollout_ref.rollout.do_vote=True,++actor_rollout_ref.rollout.n_vote=7,++actor_rollout_ref.rollout.top_p=0.95,++actor_rollout_ref.rollout.val_kwargs.do_sample=True,++actor_rollout_ref.rollout.val_kwargs.n=16,++actor_rollout_ref.rollout.val_kwargs.temperature=0.3,++actor_rollout_ref.rollout.val_kwargs.top_p=0.95,++reward_model.reward_kwargs.entropy_thres=1.0,++reward_model.reward_kwargs.mode=train,++reward_model.reward_kwargs.n_samples_per_prompt=7,++reward_model.reward_kwargs.n_votes_per_prompt=7,++reward_model.reward_kwargs.reward_type=semantic_entropy,actor_rollout_ref.actor.entropy_coeff=0.0,actor_rollout_ref.actor.kl_loss_coef=0.001,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.optim.lr=3e-7,actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0.0,actor_rollout_ref.actor.optim.warmup_style=constant,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=2560,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=1,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/data/coding/EMPO-main/verl/pretrained/Qwen2.5-Math-1.5B,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.enforce_eager=False,actor_rollout_ref.rollout.free_cache_engine=False,actor_rollout_ref.rollout.gpu_memory_utilization=0.5,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.max_model_len=2560,actor_rollout_ref.rollout.max_num_batched_tokens=2560,actor_rollout_ref.rollout.n=7,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.temperature=1.0,actor_rollout_ref.rollout.tensor_model_parallel_size=1,algorithm.adv_estimator=grpo,algorithm.gamma=1.0,algorithm.kl_ctrl.kl_coef=0.0,algorithm.lam=1.0,algorithm.norm_adv_by_std_in_grpo=True,algorithm.use_kl_in_reward=False,data.filter_overlong_prompts=True,data.max_prompt_length=512,data.max_response_length=2048,data.train_batch_size=16,data.train_files=[/data/coding/EMPO-main/verl/data/NM_20K.parquet],data.truncation=error,data.val_files=[/data/coding/EMPO-main/verl/data/amc.parquet],reward_model.reward_manager=ttrl,trainer.critic_warmup=999999,trainer.default_local_dir=/data/coding/EMPO-main/outputs/checkpoints/TTRL-verl-local-true-grpo/NM_20K-Qwen2.5-Math-1.5B/0820/semantic_entropy-Len@2k-bz-16-thres-1.0-grpo-111423,trainer.logger=[console,tensorboard],trainer.max_actor_ckpt_to_keep=2,trainer.max_critic_ckpt_to_keep=2,trainer.n_gpus_per_node=1,trainer.nnodes=1,trainer.save_freq=50,trainer.test_freq=10,trainer.total_epochs=2,trainer.total_training_steps=200
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /data/coding
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data/coding/EMPO-main/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data/coding/outputs/2025-08-20/11-14-27
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
