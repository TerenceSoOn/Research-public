  use_shm: false
  train_files:
  - /home/pterence6699/coding_empo/project_EMPO/EMPO/math_data/NM_20K_1010.parquet
  val_files:
  - /home/pterence6699/coding_empo/project_EMPO/EMPO/math_data/amc23_1010.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1024
  max_response_length: 3072
  train_batch_size: 8
  val_batch_size: null
  return_raw_input_ids: false
  return_raw_chat: false
  return_full_prompt: false
  shuffle: true
  validation_shuffle: true
  filter_overlong_prompts: false
